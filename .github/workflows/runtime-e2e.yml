name: Runtime E2E

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "d1v-cli/**"
      - "d1v-api/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/runtime-e2e.yml"

jobs:
  runtime-e2e:
    runs-on: [self-hosted, linux, x64, d1vai]
    steps:
      - name: Checkout d1v-cli
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build stub runtime artifact
        run: |
          mkdir -p dist/runtime/stub
          cat > dist/runtime/stub/opcode-api <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "--version" ]; then
            echo "opcode-api 0.0.0-e2e"
            exit 0
          fi
          echo "stub opcode-api runtime: unsupported invocation $*" >&2
          exit 1
          SH
          chmod +x dist/runtime/stub/opcode-api
          tar -C dist/runtime/stub -czf dist/runtime/opcode-api-x86_64-unknown-linux-gnu.tar.gz opcode-api
          python3 - <<'PY'
          import json
          import hashlib
          from pathlib import Path

          archive = Path("dist/runtime/opcode-api-x86_64-unknown-linux-gnu.tar.gz")
          sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(str(archive) + ".sha256").write_text(f"{sha256}\n", encoding="utf-8")
          manifest = {
              "version": "v0.0.0-e2e",
              "assets": [
                  {
                      "target": "x86_64-unknown-linux-gnu",
                      "url": archive.name,
                      "sha256": sha256,
                      "archive_name": archive.name,
                  }
              ],
          }
          Path("dist/runtime/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Serve runtime manifest
        working-directory: dist/runtime
        run: |
          python3 -m http.server 18765 >/tmp/d1v-runtime-manifest.log 2>&1 &
          echo $! > /tmp/d1v-runtime-manifest.pid

      - name: Build d1v-cli
        run: cargo build --release -p d1v-cli

      - name: Bootstrap local runtime install
        env:
          D1V_OPCODE_INSTALL_MANIFEST_URL: http://127.0.0.1:18765/manifest.json
          D1V_INSTALL_PACKAGES: never
        run: |
          export PATH="$PWD/target/release:$PATH"
          chmod +x scripts/install-opcode-runtime.sh
          scripts/install-opcode-runtime.sh --home "$RUNNER_TEMP/d1v-agent-home"

      - name: Verify installed runtime binary
        run: ~/.d1v/bin/opcode-api --version

      - name: Install Python test dependency
        run: python3 -m pip install aiohttp

      - name: Run agent relay e2e
        run: python3 scripts/test-agent-relay-e2e.py target/release/d1v

      - name: Stop runtime manifest server
        if: always()
        run: |
          if [ -f /tmp/d1v-runtime-manifest.pid ]; then
            kill "$(cat /tmp/d1v-runtime-manifest.pid)" || true
          fi
