# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Linux ARM64)
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64, d1vai]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  build-all:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux-arm64
            runner: [self-hosted, linux, arm64, d1v-linux-runner-arm64]
          - os: windows-latest
            runner: windows-latest
          - os: macos-latest
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build
        run: task build

      - name: Test
        run: task test
