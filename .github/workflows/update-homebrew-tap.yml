name: Update Homebrew Tap

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  formula:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout CLI release metadata
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Update tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN must be a GitHub App or fine-grained token with contents and pull-requests write access to d1vai/homebrew-tap." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          tmp="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/d1vai/homebrew-tap.git" "${tmp}/tap"
          cd "${tmp}/tap"
          python3 scripts/update_d1v_formula.py
          brew style Formula/d1v.rb
          brew install --formula Formula/d1v.rb
          brew test d1v
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b "update-d1v-${version}"
          git add Formula/d/d1v.rb
          git commit -m "d1v ${version}"
          git push origin HEAD
          gh pr create --title "d1v ${version}" --body "Automated formula update from the verified GitHub Release." --base main --head "update-d1v-${version}"
