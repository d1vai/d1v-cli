name: Update Homebrew Tap

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to add to the tap
        required: true
        default: v0.1.29
        type: string

jobs:
  formula:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v')) ||
          (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout CLI release metadata
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Update tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN must be a GitHub App or fine-grained token with contents and pull-requests write access to d1vai/homebrew-tap." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          brew tap d1vai/tap "https://x-access-token:${GH_TOKEN}@github.com/d1vai/homebrew-tap.git"
          cd "$(brew --repository d1vai/tap)"
          python3 scripts/update_d1v_formula.py
          brew style Formula/d1v.rb
          brew trust --formula d1vai/tap/d1v
          brew install --formula Formula/d1v.rb
          brew test d1v
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b "update-d1v-${version}"
          git add Formula/d1v.rb
          git commit -m "d1v ${version}"
          git push origin HEAD
          gh pr create --title "d1v ${version}" --body "Automated formula update from the verified GitHub Release." --base main --head "update-d1v-${version}"
