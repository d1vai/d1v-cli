# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish with --dry-run"
        type: boolean
        default: true

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for Trusted Publishing OIDC token exchange
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Test publisher
        run: python -m unittest scripts/test_publish.py

      - name: Dry-run publish
        if: env.DRY_RUN == 'true'
        run: python scripts/publish.py --dry-run

      - name: Publish with CARGO_REGISTRY_TOKEN
        if: env.DRY_RUN != 'true' && env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python scripts/publish.py

      - name: Authenticate via Trusted Publishing
        if: env.DRY_RUN != 'true' && env.HAS_TOKEN == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish with Trusted Publishing
        if: env.DRY_RUN != 'true' && env.HAS_TOKEN == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python scripts/publish.py
