# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-latest
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            use_cross: true
          - runner: ubuntu-latest
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            use_cross: true
          - runner: ubuntu-latest
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            use_cross: true
          - runner: windows-latest
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: macos-latest
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-latest
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""

      - name: Set up Binstall
        if: matrix.use_cross
        uses: cargo-bins/cargo-binstall@main

      - name: Set up Cross
        if: matrix.use_cross
        shell: bash
        run: |
          cargo-binstall cross --no-confirm --force
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          command -v cross

      - name: Build
        env:
          USE_CROSS: ${{ matrix.use_cross && 'true' || 'false' }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: task build-release

      - name: Package
        id: package
        shell: bash
        run: |
          BIN_NAME="d1v"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN_NAME="d1v.exe"
          fi

          TARGET="${{ matrix.target }}"
          VERSION="${GITHUB_REF_NAME:-dev}"
          RELEASE_DIR="target/${TARGET}/release"
          ARTIFACT_NAME="d1v-${TARGET}"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            ARTIFACT_PATH="${ARTIFACT_NAME}.zip"
            (cd "${RELEASE_DIR}" && 7z a -mx9 "${OLDPWD}/${ARTIFACT_PATH}" "${BIN_NAME}")
          else
            ARTIFACT_PATH="${ARTIFACT_NAME}.tar.gz"
            tar -czf "${ARTIFACT_PATH}" -C "${RELEASE_DIR}" "${BIN_NAME}"
          fi

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=${ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          shasum -a 256 *.tar.gz > checksums.txt

      - name: Show release files
        shell: bash
        run: ls -lah release

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: "release/*"

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
