# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  check:
    cmds:
      - cargo check

  build:
    cmds:
      - cargo build

  build-release:
    vars:
      TARGET_ARG: '{{if .CARGO_BUILD_TARGET}} --target {{.CARGO_BUILD_TARGET}}{{end}}'
    cmds:
      - cmd: cross build --release{{.TARGET_ARG}}
        if: '{{ eq .USE_CROSS "true" }}'
      - cmd: cargo build --release
        if: '{{ ne .USE_CROSS "true" }}'

  run:
    cmds:
      - cmd: cargo run
        if: "{{ eq (len .CLI_ARGS_LIST) 0 }}"
      - cmd: cargo run -- {{.CLI_ARGS}}
        if: "{{ gt (len .CLI_ARGS_LIST) 0 }}"

  install:
    cmds:
      - cargo install --path .

  test:
    cmds:
      - cargo test
