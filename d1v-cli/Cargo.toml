[package]
name = "d1v-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "d1v"
path = "src/main.rs"

[features]
record = ["d1v-api/record"]
mock = ["d1v-api/mock"]

[dependencies]
d1v-api = { path = "../d1v-api" }
anstyle = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
colorgrad = { version = "0.8", features = ["preset", "named-colors"] }
const_format = { version = "0.2", features = ["fmt"] }
fluent-templates = "0.13"
crossterm = "0.29"
jiff = "0.2"
rattles = "0.3"
ratatui = "0.30"
unicode-segmentation = "1.13"
unicode-width = "0.2"
dirs = "6.0"
keyring-core = "1.0"
parking_lot = "0.12"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3"
tokio = { version = "1.51", features = ["rt-multi-thread", "macros", "time", "signal"] }
toml = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
unic-langid = { version = "0.9", features = ["macros"] }
open = "5.3"
strum = { version = "0.28", features = ["derive"] }
normpath = "1.5"
shellexpand = "3.1"
itertools = "0.14"

[dev-dependencies]
indoc = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0"
