[package]
name = "d1v-cli"
version = "0.1.0"
edition = "2024"

[features]
record = ["d1v-api/record"]

[dependencies]
d1v-api = { path = "../d1v-api" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
inquire = "0.9"
dirs = "6.0"
keyring = "3.6"
parking_lot = "0.12"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = "0.13"
tokio = { version = "1.50", features = ["full"] }
toml = "1.0"
tracing = "0.1"
