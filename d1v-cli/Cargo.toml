[package]
name = "d1v-cli"
version = "0.1.22"
edition = "2024"
rust-version = "1.95"
description = "Experimental command-line interface for d1v.ai"
categories = ["command-line-utilities"]
keywords = ["d1vai", "ai", "cli"]
repository = "https://github.com/d1vai/d1v-cli"
license = "MIT"
exclude = ["examples/", "Taskfile.yaml", "AGENTS.md"]

[[bin]]
name = "d1v"
path = "src/main.rs"

[features]
record = ["d1v-api/record"]
mock = ["d1v-api/mock"]

[dependencies]
d1v-api = { version = "0.1.7", path = "../d1v-api" }
anstyle = "1.0"
anstream = "1.0"
anyhow = "1.0"
base16ct = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
colorgrad = { version = "0.8", features = ["preset", "named-colors"] }
const_format = { version = "0.2", features = ["fmt"] }
fluent-templates = "0.14"
crossterm = "0.29"
jiff = "0.2"
rattles = "0.3"
ratatui = "0.30"
unicode-segmentation = "1.13"
unicode-width = "0.2"
dirs = "6.0"
keyring-core = "1.0"
parking_lot = "0.12"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
semver = "1.0"
sha2 = "0.11"
sys-locale = "0.3"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "signal"] }
toml = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
unic-langid = { version = "0.9", features = ["macros"] }
open = "5.3"
strum = { version = "0.28", features = ["derive"] }
normpath = "1.5"
shellexpand = "3.1"
itertools = "0.14"
colorchoice-clap = "1.0"
indicatif = "0.18"
flate2 = "1.1"
tar = "0.4"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2.5"
base64 = "0.22"

[dev-dependencies]
indoc = "2"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0"
