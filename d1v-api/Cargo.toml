[package]
name = "d1v-api"
version = "0.1.4"
edition = "2024"
description = "Experimental Rust HTTP client for d1v.ai API."
categories = ["api-bindings", "web-programming::http-client"]
keywords = ["d1vai", "ai", "api"]
repository = "https://github.com/d1vai/d1v-cli"
license = "MIT"
exclude = ["tests/", "Taskfile.yaml", "AGENTS.md"]

[features]
record = ["dep:ahash"]
mock = []

[dependencies]
ahash = { version = "0.8", features = ["serde"], optional = true }
base64 = "0.22"
jiff = { version = "0.2", features = ["serde"] }
parking_lot = "0.12"
os_info = "3.14"
reqwest = { version = "0.13", features = ["json", "query", "multipart"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
unic-langid = "0.9"
url = "2.5"
urlencoding = "2.1"
serde_with = "3.19"
garde = { version = "0.22", features = ["email"] }

[dev-dependencies]
httpmock = "0.8"
tokio = { version = "1.51", features = ["rt", "macros"] }
